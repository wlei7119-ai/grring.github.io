<style>

*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.65}button,input{font:inherit}button,a,input{ -webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:wait;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #94b888;outline-offset:4px}button{border:0}a{color:inherit;text-decoration:none}svg{display:block}[hidden]{display:none!important}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:41px;height:41px;background:var(--green);color:#eff5df;border-radius:14px;display:grid;place-items:center}.brand-mark svg{width:27px;height:27px}.brand-name{font-size:22px;font-weight:650;letter-spacing:3px}.brand-en{font-size:9px;letter-spacing:2.7px;color:var(--muted);margin-top:-3px}.site-header{max-width:1320px;margin:auto;padding:30px 48px;display:flex;justify-content:space-between;align-items:center}.header-note{color:var(--muted);font-size:12px;letter-spacing:1px;display:flex;align-items:center;gap:8px}.header-note:before{content:"";width:6px;height:6px;border-radius:50%;background:#93a77f}
.layout{max-width:1200px;margin:10px auto 0;padding:0 30px 40px;display:grid;grid-template-columns:1.05fr 1fr;gap:80px;align-items:center;min-height:calc(100svh - 180px)}.story{align-self:stretch;display:flex;flex-direction:column;justify-content:center;position:relative}.eyebrow{font-size:10px;letter-spacing:3px;color:#6f8269;font-weight:650}.story h1{font-family:"Noto Serif CJK SC","Songti SC",SimSun,serif;font-size:45px;font-weight:500;line-height:1.5;letter-spacing:2px;margin:16px 0}.story .intro{font-size:14px;color:#7b867b;line-height:1.95;margin:0}.garden{width:100%;max-width:485px;margin:2px 0 6px}.story-foot{display:flex;gap:26px;font-size:12px;color:#6e806f;padding-left:9px}.story-foot span{display:flex;align-items:center;gap:7px}.story-foot .icon{width:15px;height:15px}
.form-card{background:#fff;border:1px solid #e5e9e0;box-shadow:0 18px 60px #314b3610;border-radius:28px;padding:38px 40px;max-width:458px;width:100%;justify-self:end}.form-kicker{color:var(--muted);font-size:11px;letter-spacing:2px}.form-card h2{font-weight:600;font-size:27px;letter-spacing:1px;margin:8px 0 5px}.subtitle{color:var(--muted);font-size:13px;margin:0 0 24px}.tabs{background:#f3f5ef;padding:5px;display:flex;border-radius:12px;gap:5px;margin-bottom:26px}.tab{flex:1;background:none;color:#7a867c;border-radius:9px;padding:10px;font-weight:500}.tab[aria-selected=true]{color:var(--green);background:#fff;box-shadow:0 2px 5px #344c3410}.field{margin-bottom:18px}.field>label{display:block;font-size:13px;margin-bottom:8px;font-weight:550}.input-wrap{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;background:#fdfefb;padding:0 13px;transition:border-color .2s,box-shadow .2s}.input-wrap:focus-within{border-color:#6c9173;box-shadow:0 0 0 3px #abc29822}.input-wrap>.icon{width:18px;color:#96a293;flex-shrink:0}.input-wrap input{background:none;outline:none;border:0;color:var(--ink);padding:13px 0;min-width:0;width:100%;height:49px}.input-wrap input::placeholder{color:#9ba398;font-size:12px}.input-wrap input:focus-visible{outline:none}.reveal{display:grid;place-items:center;min-width:36px;height:40px;background:transparent;color:#8b988b;border-radius:7px}.reveal[aria-pressed=true]{color:var(--green);background:#edf2e8}.help-line{display:flex;justify-content:flex-end;margin:-4px 0 20px}.text-btn{color:var(--green);background:none;font-size:12px;padding:2px}.check-label{display:flex;gap:8px;font-size:11px;color:#81907e;align-items:flex-start;margin:3px 0 21px;line-height:1.8}.check-label input{width:15px;height:15px;accent-color:var(--green);margin:3px 0 0;flex:none}.check-label button{font-size:11px;text-decoration:underline;text-underline-offset:3px}.primary{display:flex;justify-content:center;align-items:center;gap:10px;background:var(--green);color:#fff;border:1px solid var(--green);border-radius:11px;padding:13px 18px;min-height:48px;transition:background .2s,transform .2s;font-weight:500}.primary:hover{background:var(--green-dark);transform:translateY(-1px)}.primary.full{width:100%}.primary .icon{width:18px}.form-bottom{text-align:center;color:#98a092;font-size:11px;margin:22px 0 0}.message{background:#fff0ee;border:1px solid #efcfca;color:var(--red);padding:10px 12px;border-radius:9px;font-size:12px;margin:0 0 17px;white-space:pre-wrap}.message.success{background:#edf5e9;border-color:#d2e5c9;color:#42704c}.footer{text-align:center;color:#9aa391;font-size:10px;letter-spacing:1.3px;padding:0 20px 24px}.back-login{margin:15px auto 0;display:block}.dialog{width:min(470px,calc(100% - 32px));max-height:85svh;border:1px solid var(--line);border-radius:23px;padding:28px;color:var(--ink);box-shadow:0 25px 100px #15321e30}.dialog::backdrop{background:#1b382e60;backdrop-filter:blur(4px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}.dialog h3{font-size:20px;margin:0;font-weight:550}.icon-btn{display:grid;place-items:center;width:38px;height:38px;background:#f2f5ed;color:#6c7e6c;border-radius:50%}.dialog p{color:var(--muted);font-size:13px}.document-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:13px;max-height:48svh;overflow:auto;margin:15px 0 22px}.spinner{width:17px;height:17px;border:2px solid #ffffff60;border-top-color:#fff;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:1400px){.layout{gap:100px}.story h1{font-size:49px}.garden{max-width:510px}}
@media(max-width:960px){.layout{gap:38px;padding:0 30px 35px}.form-card{padding:32px}.story h1{font-size:36px}.story-foot{gap:15px;font-size:11px}}
@media(max-width:720px){.site-header{padding:23px 24px}.header-note{font-size:10px}.layout{display:block;min-height:auto;padding:5px 22px 25px;margin:0 auto;max-width:490px}.story{padding:16px 7px 18px}.eyebrow{font-size:9px}.story h1{font-size:30px;margin:10px 0}.story .intro{font-size:12px}.garden,.story-foot{display:none}.form-card{padding:28px 25px;border-radius:23px;max-width:none}.form-card h2{font-size:25px}.form-kicker{display:none}.subtitle{margin-bottom:22px}.footer{font-size:9px;padding-bottom:max(22px,env(safe-area-inset-bottom))}.brand-mark{width:36px;height:36px;border-radius:12px}.brand-name{font-size:20px}}
@media(max-width:720px){.input-wrap input{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="site-header">
 <a class="brand" href="Login.html" aria-label="心屿登录首页"><span class="brand-mark"><svg class="icon"><use href="#i-leaf"/></svg></span><div><div class="brand-name">心屿</div><div class="brand-en">MIND ISLAND</div></div></a>
 <div class="header-note">留一点时间，给自己</div>
</header>
<main class="layout">
 <section class="story" aria-label="平台介绍">
  <span class="eyebrow">A LITTLE SPACE FOR YOUR MIND</span>
  <h1>让心事有处安放，<br>让改变慢慢发生。</h1>
  <p class="intro">从一次对话、一段练习、一份记录开始，<br>在日常的细微处，重新认识自己。</p>
  <svg class="garden" viewBox="0 0 500 340" role="img" aria-label="阳光下的绿色小岛与舒展的植物">
   <defs><clipPath id="arch"><path d="M125 287V135a126 126 0 0 1 252 0v152Z"/></clipPath><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e7eedc"/><stop offset="1" stop-color="#f1f2dd"/></linearGradient></defs>
   <path d="M107 287V135a145 145 0 0 1 290 0v152" fill="none" stroke="#dce4d2" stroke-width="1"/>
   <g clip-path="url(#arch)"><path d="M125 0h252v287H125z" fill="url(#sky)"/><circle cx="285" cy="98" r="44" fill="#f8eabd"/><path d="M99 238Q210 129 397 219v104H99Z" fill="#c5d4b1"/><path d="M106 279q91-127 271-15v59H106Z" fill="#789876"/><path d="M132 288q125-67 263 4v34H132Z" fill="#456a52"/><path d="M220 196q109 14 10 44t44 60" fill="none" stroke="#f0efd9" stroke-width="8" stroke-linecap="round"/></g>
   <ellipse cx="252" cy="300" rx="181" ry="15" fill="#dae1d0" opacity=".5"/><path d="M127 291V165" stroke="#527655" stroke-width="2"/><path d="M127 226c-43-3-64-35-49-68 40 2 57 37 49 68" fill="#849d6b"/><path d="M126 199c-2-42 22-63 50-61 4 35-13 58-50 61" fill="#b1c298"/><path d="M127 268c-38 1-58-19-59-44 31-10 60 12 59 44" fill="#a7bb8e"/><path d="M127 250c2-29 24-47 54-40-1 30-24 44-54 40" fill="#5e805b"/>
   <path d="M106 276h43l-6 28h-30Z" fill="#dcd9c8"/><path d="M377 295v-88" stroke="#637b57" stroke-width="2"/><path d="M377 248q-47-9-40-49 44 0 40 49" fill="#8da679"/><path d="M377 272q44-7 45-42-40-6-45 42" fill="#bdcba4"/><ellipse cx="371" cy="302" rx="25" ry="9" fill="#cecbb4"/>
   <path d="M67 128h19m-9-9v18M409 124h13m-7-7v14" stroke="#a6b58f" stroke-width="1.5"/><circle cx="90" cy="255" r="3" fill="#d5bc7e"/><circle cx="410" cy="165" r="3" fill="#d5bc7e"/>
  </svg>
  <div class="story-foot"><span><svg class="icon"><use href="#i-check"/></svg>认知重构对话</span><span><svg class="icon"><use href="#i-check"/></svg>正念与放松</span><span><svg class="icon"><use href="#i-check"/></svg>日常状态记录</span></div>
 </section>
 <section class="form-card" aria-labelledby="formTitle">
  <div class="form-kicker">YOUR JOURNEY STARTS HERE</div>
  <h2 id="formTitle">欢迎来到心屿</h2><p class="subtitle" id="formSubtitle">给自己一段不被打扰的时间。</p>
  <div class="tabs" role="tablist" aria-label="登录或注册" id="authTabs"><button class="tab" type="button" role="tab" id="loginTab" aria-controls="authPanel" aria-selected="true" tabindex="0">登录</button><button class="tab" type="button" role="tab" id="registerTab" aria-controls="authPanel" aria-selected="false" tabindex="-1">注册</button></div>
  <div id="authPanel" role="tabpanel" aria-labelledby="loginTab">
   <div id="formMessage" class="message" role="alert" hidden></div>
   <form id="authForm" novalidate>
    <div class="field" id="accountField"><label for="account">账号</label><div class="input-wrap"><svg class="icon"><use href="#i-user"/></svg><input id="account" name="username" autocomplete="username" placeholder="请输入用户名或邮箱" maxlength="100" required></div></div>
    <div class="field" id="emailField" hidden><label for="email">邮箱</label><div class="input-wrap"><svg class="icon"><use href="#i-mail"/></svg><input id="email" name="email" type="email" autocomplete="email" placeholder="用于验证身份和找回密码" maxlength="254"></div></div>
    <div class="field"><label for="password" id="passwordLabel">密码</label><div class="input-wrap"><svg class="icon"><use href="#i-lock"/></svg><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入至少 6 位密码" minlength="6" maxlength="128" required><button type="button" class="reveal" data-reveal="password" aria-label="显示密码" aria-pressed="false"><svg class="icon"><use href="#i-eye"/></svg></button></div></div>
    <div class="field" id="confirmField" hidden><label for="confirmPassword">确认密码</label><div class="input-wrap"><svg class="icon"><use href="#i-lock"/></svg><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入密码" maxlength="128"><button type="button" class="reveal" data-reveal="confirmPassword" aria-label="显示确认密码" aria-pressed="false"><svg class="icon"><use href="#i-eye"/></svg></button></div></div>
    <div class="help-line" id="forgotRow"><button class="text-btn" type="button" id="forgotBtn">忘记密码？</button></div>
    <label class="check-label" id="consentField" hidden><input type="checkbox" id="consentCheck" disabled><span>我已阅读并同意<button type="button" class="text-btn" id="readConsent">《研究说明与数据使用说明》</button></span></label>
    <button class="primary full" type="submit" id="submitButton"><span id="submitText">登录，进入心屿</span><svg class="icon" id="submitArrow"><use href="#i-arrow"/></svg><span class="spinner" id="submitSpinner" hidden></span></button>
   </form>
  </div>
  <button type="button" class="text-btn back-login" id="backLogin" hidden>返回登录</button>
  <p class="form-bottom">每一次看见自己，都是新的开始。</p>
 </section>
</main>
<footer class="footer">心屿 MIND ISLAND · 觉察当下，慢慢生长</footer>
<dialog class="dialog" id="forgotDialog" aria-labelledby="forgotTitle"><div class="dialog-head"><h3 id="forgotTitle">找回密码</h3><button class="icon-btn" data-close="forgotDialog" aria-label="关闭找回密码"><svg class="icon"><use href="#i-x"/></svg></button></div><p>输入注册时使用的邮箱。验证身份后，你可以设置新的密码。</p><form id="forgotForm"><div class="field"><label for="recoveryEmail">注册邮箱</label><div class="input-wrap"><svg class="icon"><use href="#i-mail"/></svg><input id="recoveryEmail" type="email" autocomplete="email" required placeholder="请输入注册邮箱" maxlength="254"></div></div><div id="forgotMessage" class="message" role="status" hidden></div><button class="primary full" type="submit" id="recoverySubmit">发送重置邮件</button></form></dialog>
<dialog class="dialog" id="consentDialog" aria-labelledby="consentTitle"><div class="dialog-head"><h3 id="consentTitle">研究说明与数据使用</h3><button class="icon-btn" data-close="consentDialog" aria-label="关闭研究说明"><svg class="icon"><use href="#i-x"/></svg></button></div><div id="consentText" class="document-text" role="status"></div><button type="button" class="primary full" id="consentRead" disabled>我已阅读</button></dialog>
<script>
/*
 * 心屿前端 / Login.html / 与 Main.html 放在同一目录，区分文件名大小写。
 * 前端交付，不含 Flask、OSS、邮件服务或 DeepSeek 密钥。勿将任何服务密钥写入 HTML。
 * 同源 Flask JSON 接口契约：成功返回 {data: ...}，失败 {error:{code,message}}。
 * GET  /api/auth/session -> {user:null|{id,...},csrf_token:string}（匿名也签发 CSRF）
 * POST /api/auth/login {account,password} -> {user,csrf_token}; 服务端设置 HttpOnly/Secure/SameSite Cookie。
 * POST /api/auth/register {username,email,password,consent:{version,accepted:true}} -> {user?,csrf_token?}
 * GET  /api/study/consent -> {version,title?,content}，content 必须为正式研究说明纯文本。
 * POST /api/auth/password/forgot {email} -> {}; 始终返回相同成功文案，防止枚举账号。
 * POST /api/auth/password/reset {token,password} -> {}; 重置邮件指向 Login.html?reset_token=...。
 * 服务端验证密码、CSRF、研究同意版本及速率限制；勿依赖前端校验。
 * GET 返回 Cache-Control:no-store。跨域部署需明确 CORS 白名单与 credentials；优先同源。
 */
(()=>{'use strict';
 const CONFIG=Object.freeze({API_BASE:'/api',MAIN_PAGE:'Main.html',TIMEOUT:18000});
 const $=id=>document.getElementById(id);let mode='login',csrf='',consentVersion='',busy=false;
 const resetToken=new URLSearchParams(location.search).get('reset_token');
 if(resetToken&&location.protocol!=='file:'){const clean=new URL(location.href);clean.searchParams.delete('reset_token');history.replaceState(null,'',clean.pathname+clean.search+clean.hash);}
 function showMessage(id,text,success=false){const e=$(id);e.textContent=text;e.classList.toggle('success',success);e.hidden=!text;}
 async function api(path,body){if(location.protocol==='file:')throw new Error('暂时无法连接服务，请在平台开放后重试。');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),CONFIG.TIMEOUT);try{const headers={Accept:'application/json'};if(body!==undefined){headers['Content-Type']='application/json';if(csrf)headers['X-CSRF-Token']=csrf;}const res=await fetch(CONFIG.API_BASE+path,{method:body===undefined?'GET':'POST',headers,credentials:'include',cache:'no-store',body:body===undefined?undefined:JSON.stringify(body),signal:controller.signal});if(!res.headers.get('content-type')?.includes('application/json'))throw new Error('服务暂不可用，请稍后重试。');const payload=await res.json();if(!res.ok||payload.error){const messages={INVALID_CREDENTIALS:'账号或密码不正确，请重新输入。',ACCOUNT_EXISTS:'该账号或邮箱已注册，请直接登录。',RATE_LIMITED:'操作过于频繁，请稍后重试。',TOKEN_EXPIRED:'重置链接已失效，请重新申请。',CONSENT_VERSION_CHANGED:'研究说明已更新，请重新阅读后注册。'};throw new Error(messages[payload.error?.code]||(res.status===429?'操作过于频繁，请稍后重试。':'请求未完成，请检查填写内容或稍后重试。'));}return payload.data??payload;}catch(e){if(e.name==='AbortError')throw new Error('连接超时，请稍后重试。');if(e instanceof TypeError)throw new Error('无法连接服务，请检查网络后重试。');throw e;}finally{clearTimeout(timer);}}
 const boot=api('/auth/session').then(d=>{csrf=d.csrf_token||'';}).catch(()=>{});
 function setMode(next){if(busy)return;mode=next;const reg=next==='register',reset=next==='reset';$('loginTab').setAttribute('aria-selected',String(!reg));$('registerTab').setAttribute('aria-selected',String(reg));$('loginTab').tabIndex=reg?-1:0;$('registerTab').tabIndex=reg?0:-1;$('authPanel').setAttribute('aria-labelledby',reg?'registerTab':'loginTab');$('authTabs').hidden=reset;$('accountField').hidden=reset;$('emailField').hidden=!reg;$('confirmField').hidden=!(reg||reset);$('consentField').hidden=!reg;$('forgotRow').hidden=reg||reset;$('backLogin').hidden=!reset;$('password').autocomplete=reg||reset?'new-password':'current-password';$('passwordLabel').textContent=reset?'新密码':'密码';$('formTitle').textContent=reset?'设置新的密码':reg?'从这里，开始认识自己':'欢迎来到心屿';$('formSubtitle').textContent=reset?'设置后，请使用新密码重新登录。':reg?'创建账号，开启你的心屿旅程。':'给自己一段不被打扰的时间。';$('submitText').textContent=reset?'保存新密码':reg?'创建我的账号':'登录，进入心屿';$('account').placeholder=reg?'设置 3–32 位用户名':'请输入用户名或邮箱';$('password').value='';$('confirmPassword').value='';showMessage('formMessage','');}
 $('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('backLogin').onclick=()=>setMode('login');
 $('authTabs').addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();setMode(e.key==='Home'?'login':e.key==='End'?'register':mode==='login'?'register':'login');$(mode==='login'?'loginTab':'registerTab').focus();}});
 document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{const input=$(b.dataset.reveal),show=input.type==='password';input.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',`${show?'隐藏':'显示'}${input.id==='confirmPassword'?'确认':''}密码`);});
 document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
 document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
 $('forgotBtn').onclick=()=>{showMessage('forgotMessage','');$('forgotDialog').showModal();};
 $('readConsent').onclick=async()=>{$('consentDialog').showModal();$('consentRead').disabled=true;$('consentText').textContent='正在加载研究说明…';try{const d=await api('/study/consent');if(!d.version||!d.content)throw new Error('研究说明暂未开放，请联系研究人员。');consentVersion=String(d.version);$('consentText').textContent=d.content;$('consentRead').disabled=false;}catch(e){consentVersion='';$('consentCheck').checked=false;$('consentCheck').disabled=true;$('consentText').textContent=e.message;}};
 $('consentRead').onclick=()=>{if(!consentVersion)return;$('consentCheck').disabled=false;$('consentDialog').close();$('consentCheck').focus();};
 $('authForm').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;showMessage('formMessage','');const account=$('account').value.trim(),password=$('password').value,email=$('email').value.trim();let problem='',focusId='account';if(mode!=='reset'&&!account)problem='请输入账号。';else if(mode==='register'&&!/^[\p{L}\p{N}_-]{3,32}$/u.test(account))problem='用户名需为 3–32 位文字、字母、数字、下划线或短横线。';else if(mode==='register'&&(!email||!$('email').checkValidity())){problem='请输入有效的邮箱地址。';focusId='email';}else if(password.length<6||password.length>128){problem='密码长度应为 6–128 位。';focusId='password';}else if(mode!=='login'&&password!==$('confirmPassword').value){problem='两次输入的密码不一致。';focusId='confirmPassword';}else if(mode==='register'&&(!$('consentCheck').checked||!consentVersion)){problem='请先阅读研究说明，并勾选同意后注册。';focusId='readConsent';}if(problem){showMessage('formMessage',problem);$(focusId).focus();return;}busy=true;$('submitButton').disabled=true;$('submitSpinner').hidden=false;$('submitArrow').hidden=true;try{await boot;if(!csrf){const d=await api('/auth/session');csrf=d.csrf_token||'';}if(mode==='reset'){await api('/auth/password/reset',{token:resetToken,password});busy=false;setMode('login');showMessage('formMessage','密码已更新，请使用新密码登录。',true);}else if(mode==='register'){const d=await api('/auth/register',{username:account,email,password,consent:{version:consentVersion,accepted:true}});csrf=d.csrf_token||csrf;if(d.user?.id){showMessage('formMessage','注册成功，正在进入心屿…',true);location.assign(CONFIG.MAIN_PAGE);}else{busy=false;setMode('login');showMessage('formMessage','注册成功，请登录；如收到验证邮件，请先完成邮箱验证。',true);}}else{const d=await api('/auth/login',{account,password});if(!d.user?.id)throw new Error('登录状态未确认，请稍后重试。');$('password').value='';showMessage('formMessage','登录成功，正在进入心屿…',true);location.assign(CONFIG.MAIN_PAGE);}}catch(err){showMessage('formMessage',err.message);}finally{busy=false;$('submitButton').disabled=false;$('submitSpinner').hidden=true;$('submitArrow').hidden=false;}});
 $('forgotForm').addEventListener('submit',async e=>{e.preventDefault();const button=$('recoverySubmit');if(button.disabled)return;button.disabled=true;showMessage('forgotMessage','');try{await boot;if(!csrf){const d=await api('/auth/session');csrf=d.csrf_token||'';}await api('/auth/password/forgot',{email:$('recoveryEmail').value.trim()});showMessage('forgotMessage','如果该邮箱已注册，你会收到重置邮件。请检查收件箱及垃圾邮件。',true);}catch(err){showMessage('forgotMessage',err.message);}finally{button.disabled=false;}});
 if(resetToken)setMode('reset');
})();
</script>
</body>
</html>
